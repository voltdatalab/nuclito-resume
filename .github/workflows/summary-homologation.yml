name: Summary MySQL 8 and production image homologation

on:
  pull_request:
  push:
    branches: ['feat/**', 'feature/**', 'test/**', 'ci/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summary-homologation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nuclito_ci
          MYSQL_ROOT_PASSWORD: fixture-root-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfixture-root-only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
          --memory=1g --cpus=2
    env:
      PYTHON_DOTENV_DISABLED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Private test environment (not production dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config default-libmysqlclient-dev
          python -m venv "$RUNNER_TEMP/summary-tests"
          "$RUNNER_TEMP/summary-tests/bin/python" -m pip install -r api/v2/requirements-mysql-test.txt
          "$RUNNER_TEMP/summary-tests/bin/python" -c "import MySQLdb, sqlalchemy, pytest; from importlib.metadata import version; assert version('mysqlclient') == '2.3.0'; print('mysqlclient', version('mysqlclient'), 'SQLAlchemy', sqlalchemy.__version__)"
      - name: Offline gate-tool regressions
        run: '"$RUNNER_TEMP/summary-tests/bin/python" -m pytest gate_tests -q'
      - name: Independent offline SQLite unit runner
        working-directory: api/v2
        env:
          PYTHONPATH: .
        run: '"$RUNNER_TEMP/summary-tests/bin/python" -m pytest tests -q'
      - name: Real MySQL 8 gate (missing DSN is an error, never skipped)
        working-directory: api/v2
        env:
          PYTHONPATH: .
          NUCLITO_MYSQL_TEST_DSN: mysql+mysqldb://root:fixture-root-only@127.0.0.1:3306/nuclito_ci
        run: |
          "$RUNNER_TEMP/summary-tests/bin/python" -m pytest mysql_tests -q --strict-markers --timeout=30 --junitxml="$RUNNER_TEMP/mysql-results.xml"
          "$RUNNER_TEMP/summary-tests/bin/python" ../../scripts/check_mysql_receipt.py "$RUNNER_TEMP/mysql-results.xml"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build exact production Dockerfile/context, locally loaded only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api/v2
          file: ./api/v2/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nuclito-summary-ci:gate
          provenance: false
      - name: Real production CMD smoke on internal-only network
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: 'python scripts/container_smoke.py --image nuclito-summary-ci:gate --mysql-container "$MYSQL_CONTAINER"'
